<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520" fill="none">
  <defs>
    <linearGradient id="mEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="mCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="mGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Resplandor decorativo de fondo -->
  <circle cx="190" cy="260" r="180" fill="url(#mGlow)" />

  <!-- Carcasa del Celular (Smartphone Vertical) -->
  <rect x="25" y="10" width="330" height="500" rx="44" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <rect x="32" y="17" width="316" height="486" rx="38" fill="#FFFFFF"/>

  <!-- Isla Dinamica / Notch -->
  <rect x="135" y="26" width="110" height="18" rx="9" fill="#0F172A" />
  <circle cx="230" cy="35" r="3" fill="#10B981" />
  <circle cx="150" cy="35" r="4" fill="#1E293B" />

  <!-- Contenedor Pantalla App Credi Avanza -->
  <g transform="translate(42, 54)">
    
    <!-- Header App -->
    <text x="6" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#047857">Credi Avanza Móvil</text>
    <rect x="220" y="4" width="70" height="18" rx="9" fill="#ECFDF5" />
    <text x="232" y="17" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#059669">100% Seguro</text>

    <!-- Tarjeta Principal Saldo Pre-Aprobado -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="296" height="106" rx="18" fill="url(#mEmeraldGrad)" />
      <text x="18" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D1FAE5" letter-spacing="0.5">MONTO PRE-APROBADO</text>
      <text x="255" y="28" font-family="'Inter', sans-serif" font-size="12">🇵🇪</text>
      
      <text x="18" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">S/ 15,000</text>
      
      <line x1="18" y1="80" x2="278" y2="80" stroke="#34D399" stroke-opacity="0.4" stroke-width="1"/>
      <text x="18" y="96" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#ECFDF5">Tasa preferencial desde 1.2% mensual</text>
    </g>

    <!-- Tarjeta Simulador Cuotas -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="296" height="68" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="16" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B">Plazo Solicitado:</text>
      <text x="220" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A">24 Meses</text>
      
      <text x="16" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B">Cuota Mensual:</text>
      <text x="210" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#047857">S/ 825*</text>
    </g>

    <!-- Insignia 1: Sin Historial Crediticio -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="296" height="54" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
      <circle cx="28" cy="27" r="16" fill="#D1FAE5" />
      <path d="M28 17L35 21V28C35 33 28 36 28 36C28 36 21 33 21 28V21L28 17Z" fill="#059669" />
      <path d="M25 27L27 29L31 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="54" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#064E3B">Sin Historial Crediticio</text>
      <text x="54" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#047857">Evaluación inclusiva sin récord excluyente</text>
    </g>

    <!-- Insignia 2: Sin Datos de Tarjetas -->
    <g transform="translate(0, 294)">
      <rect x="0" y="0" width="296" height="54" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="28" cy="27" r="16" fill="#E2E8F0" />
      <rect x="18" y="21" width="20" height="13" rx="2" fill="#059669"/>
      <line x1="18" y1="25" x2="38" y2="25" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="23" cy="29" r="1" fill="#FFFFFF"/>
      <circle cx="26" cy="29" r="1" fill="#FFFFFF"/>
      
      <text x="54" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0F172A">Sin Datos de Tarjetas</text>
      <text x="54" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B">Cero solicitud de claves ni números de tarjeta</text>
    </g>

    <!-- Boton CTA en App -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="296" height="46" rx="14" fill="#059669" />
      <text x="65" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">SOLICITAR AHORA ➔</text>
    </g>

  </g>

  <!-- Boton Home inferior -->
  <rect x="145" y="492" width="90" height="4" rx="2" fill="#94A3B8" />
</svg>